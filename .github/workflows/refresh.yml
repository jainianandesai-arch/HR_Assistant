name: Refresh government source cache

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC ≈ early morning ET, daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run refresh
        env:
          CHANGE_NOTIFY_WEBHOOK_URL: ${{ secrets.CHANGE_NOTIFY_WEBHOOK_URL }}
        run: python scripts/refresh_knowledge.py

      - name: Commit updated cache
        run: |
          git config user.name "hr-assistant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/knowledge_cache.json data/refresh_changelog.json
          git diff --quiet --cached || git commit -m "Nightly refresh of government source cache"
          git push
